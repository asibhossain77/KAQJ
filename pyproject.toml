
[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kaqj"
version = "0.1.0"
description = "A local-first personal AI assistant."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0"
]

[project.scripts]
kaqj = "kaqj.main:main"

[tool.setuptools.packages.find]
where = ["src"]
